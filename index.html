
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>獎懲紀錄產生器</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#24324a;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0}
header{background:#244b80;color:white;padding:20px}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;opacity:.85}
main{max-width:1050px;margin:20px auto;padding:0 15px}
section{background:white;border:1px solid #dce4ef;border-radius:14px;padding:20px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 15px}
label{display:block;font-weight:600;margin:12px 0 6px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid #b8c7d9;border-radius:8px;background:white}
textarea{min-height:95px}
button{border:0;border-radius:8px;padding:11px 18px;background:#285a96;color:white;cursor:pointer}
button.secondary{background:#e7edf6;color:#244b80}
button:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
.note{font-size:13px;color:#63738b;line-height:1.7}
.status{background:#eef5ff;border-radius:8px;padding:12px;margin-top:12px}
.error{color:#b42318}
.ok{color:#147d4d}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{border:1px solid #dce4ef;padding:9px;text-align:left}
th{background:#eef3f9}
.badge{display:inline-block;background:#e7edf6;padding:4px 9px;border-radius:6px}
</style>
</head>
<body>
<header>
<h1>獎懲紀錄產生器</h1>
<p>批次輸入學生・自動比對名冊・匯出學校 Excel</p>
</header>
<main>
<section>
<h2>① 匯入資料</h2>
<div class="grid">
<div>
<label>學生名冊 Excel</label>
<input type="file" id="rosterFile" accept=".xlsx,.xls">
</div>
<div>
<label>獎懲匯入範本 Excel</label>
<input type="file" id="templateFile" accept=".xlsx,.xls">
</div>
</div>
<div id="importStatus" class="status">尚未匯入資料</div>
<p class="note">Excel 只在本機瀏覽器處理，不會上傳到 GitHub。請勿將學生名冊提交到公開儲存庫。</p>
</section>

<section>
<h2>② 批次選擇學生</h2>

<label>輸入學生（可多筆）</label>
<textarea id="studentInput" placeholder="例如：001、4501039、王小明（可混合輸入）"></textarea>
<p class="note">支援女生隊號、建制隊號、姓名混合輸入；以換行、逗號、頓號或空格分隔。女生隊號支援 001-010。</p>
</section>

<section>
<h2>③ 設定共同獎懲內容</h2>
<p class="note">請依序選擇條、款、目，系統將自動帶入「獎懲項目」工作表中的原始事由。</p>
<label>1. 獎懲依據（條）</label><select id="article"><option value="">請先匯入範本</option></select>
<label>2. 獎懲依據（款）</label><select id="clause" disabled><option value="">請先選擇條</option></select>
<label>3. 獎懲依據（目）</label><select id="item" disabled><option value="">請先選擇款</option></select>
<label>4. 獎懲事由（依條款目自動帶入）</label><textarea id="reason" readonly placeholder="選擇條、款、目後自動顯示"></textarea>
<label>5. 額度</label><select id="amount"><option value="">請先匯入範本</option></select>
<label>6. 加重減輕事由（若無可不選擇）</label><select id="adjustReason"><option value="">無</option></select>
<label>7. 加重減輕額度（若無可不選擇）</label><select id="adjustAmount"><option value="">無</option></select>
<div class="actions">
<button id="previewBtn">產生紀錄預覽</button>
<button id="clearBtn" class="secondary">清除輸入</button>
</div>
</section>

<section>
<h2>④ 預覽與匯出</h2>
<div id="resultStatus" class="status">尚未產生紀錄</div>
<div class="tablewrap">
<table>
<thead><tr>
<th>學號</th><th>姓名</th><th>條</th><th>款</th><th>目</th><th>獎懲事由</th><th>額度</th>
</tr></thead>
<tbody id="previewBody"></tbody>
</table>
</div>
<div class="actions">
<button id="exportBtn" disabled>匯出 Excel</button>
</div>
</section>
</main>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
"use strict";

const $ = id => document.getElementById(id);
let roster = [];
let rules = [];
let amountOptions=[];
let defaultAmounts={};
let adjustmentOptions=[];
let output = [];
let templateWorkbook = null;
let templateHeaders = [
 "學號","姓名","獎懲依據（條）","獎懲依據（款）",
 "獎懲依據（目）","獎懲事由","額度",
 "加重減輕事由","加重減輕額度"
];

function clean(v){
 return String(v ?? "").trim();
}
function normalize(v){
 return clean(v).replace(/\s+/g,"").toLowerCase();
}
function findColumn(headers,words){
 return headers.findIndex(h =>
  words.some(w=>normalize(h).includes(normalize(w)))
 );
}
function sheetRows(sheet){
 return XLSX.utils.sheet_to_json(sheet,{
  header:1,defval:"",raw:false
 });
}
function findHeaderRow(rows,groups){
 let best={index:-1,score:0};
 rows.slice(0,30).forEach((row,i)=>{
  let score=groups.filter(g=>
   row.some(c=>g.some(w=>normalize(c).includes(normalize(w))))
  ).length;
  if(score>best.score)best={index:i,score};
 });
 return best;
}
function readExcel(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>{
   try{
    resolve(XLSX.read(reader.result,{type:"array"}));
   }catch(e){reject(e);}
  };
  reader.onerror=()=>reject(new Error("無法讀取檔案"));
  reader.readAsArrayBuffer(file);
 });
}
function setImportStatus(message,isError=false){
 $("importStatus").textContent=message;
 $("importStatus").className="status "+(isError?"error":"ok");
}
function extractRoster(wb){
 const sheetNames=[...wb.SheetNames].sort((a,b)=>(a==="姓名查詢"?-1:b==="姓名查詢"?1:0));
 let best=[];
 for(const name of sheetNames){
  const rows=sheetRows(wb.Sheets[name]);
  const h=findHeaderRow(rows,[["姓名"],["學籍號碼","學籍號","學號"],["女生隊號"],["建制隊號"]]);
  if(h.score<2)continue;
  const headers=rows[h.index].map(clean);
  const nameCol=findColumn(headers,["姓名"]);
  const schoolCol=findColumn(headers,["學籍號碼","學籍號","學號"]);
  const femaleCol=findColumn(headers,["女生隊號"]);
  const teamCol=findColumn(headers,["建制隊號"]);
  if(nameCol<0||schoolCol<0)continue;
  const data=rows.slice(h.index+1).map(row=>({
   name:clean(row[nameCol]),
   school:clean(row[schoolCol]).replace(/\\.0$/,""),
   female:femaleCol>=0?clean(row[femaleCol]).replace(/\\.0$/,""):"",
   team:teamCol>=0?clean(row[teamCol]).replace(/\\.0$/,""):""
  })).filter(x=>x.name&&/^\\d{10}$/.test(x.school));
  if(name==="姓名查詢"&&data.length)return data;
  if(data.length>best.length)best=data;
 }
 if(!best.length)throw new Error("無法辨識名冊：請確認 Excel 有「姓名查詢」工作表，且包含姓名、10位數學籍號碼。");
 return best;
}
function fillOptions(id,values,placeholder){
 const el=$(id);el.replaceChildren(new Option(placeholder,""));
 for(const value of values)el.add(new Option(value,value));
 return el;
}
function extractRules(wb){
 const sheet=wb.Sheets["獎懲項目"];
 if(!sheet)throw new Error("找不到「獎懲項目」工作表");
 const rows=sheetRows(sheet);
 const parsed=[];
 amountOptions=[];defaultAmounts={};adjustmentOptions=[];
 for(const row of rows){
  const [article,clause,item,,reason,,g,h,,j]=Array.from({length:10},(_,i)=>clean(row[i]));
  if(/^第\d+條$/.test(g)&&h)defaultAmounts[g]=h;
  if(/^\d+$/.test(g)&&h&&h!=="以下空白"&&!amountOptions.includes(h))amountOptions.push(h);
  if(j&&j!=="加重減輕事由"&&!adjustmentOptions.includes(j))adjustmentOptions.push(j);
  if(/^第\d+條$/.test(article)&&/^第\d+款$/.test(clause)&&reason)
   parsed.push({article,clause,item,reason});
 }
 if(!parsed.length)throw new Error("「獎懲項目」工作表未找到有效的條款與事由");
 fillOptions("article",[...new Set(parsed.map(r=>r.article))],"請選擇條");
 fillOptions("clause",[],"請先選擇條");
 fillOptions("item",[],"請先選擇款");
 fillOptions("amount",amountOptions,"請選擇額度");
 fillOptions("adjustReason",adjustmentOptions,"無");
 fillOptions("adjustAmount",amountOptions,"無");
 $("clause").disabled=true;$("item").disabled=true;
 $("reason").value="";
 return parsed;
}
function updateClause(){
 const article=$("article").value;
 fillOptions("clause",[...new Set(rules.filter(r=>r.article===article).map(r=>r.clause))],"請選擇款");
 $("clause").disabled=!article;
 fillOptions("item",[],"請先選擇款");$("item").disabled=true;
 $("reason").value="";
 $("amount").value=defaultAmounts[article]||"";
}
function updateItem(){
 const article=$("article").value,clause=$("clause").value;
 const relevant=rules.filter(r=>r.article===article&&r.clause===clause);
 const items=[...new Set(relevant.map(r=>r.item).filter(Boolean))];
 if(items.length){
  fillOptions("item",items,"請選擇目");
  $("item").disabled=false;
  $("reason").value="";
 }else{
  fillOptions("item",[],"無目（不需選擇）");
  $("item").disabled=true;
  $("reason").value=relevant[0]?.reason||"";
 }
}
function updateReason(){
 const r=rules.find(r=>r.article===$("article").value&&r.clause===$("clause").value&&r.item===$("item").value);
 $("reason").value=r?.reason||"";
}
function parseStudents(){
 const tokens=$("studentInput").value.split(/[\s,，、;；]+/).map(clean).filter(Boolean);
 const values=[];
 for(const token of tokens){
  const range=token.match(/^(\d{1,3})-(\d{1,3})$/);
  if(range){
   const a=Number(range[1]),b=Number(range[2]);
   if(b<a||b-a>300)throw new Error("女生隊號範圍不正確："+token);
   for(let n=a;n<=b;n++)values.push(String(n).padStart(3,"0"));
  }else values.push(token);
 }
 return values;
}
function matchStudent(token){
 const t=normalize(token);
 const candidates=roster.filter(s=>
  normalize(s.name)===t ||
  normalize(s.team)===t ||
  (/^\d{1,3}$/.test(t) && normalize(s.female).padStart(3,"0")===t.padStart(3,"0"))
 );
 const unique=[...new Map(candidates.map(s=>[s.school,s])).values()];
 if(!unique.length)return {error:"找不到："+token};
 if(unique.length>1)return {error:"資料不唯一："+token};
 return {student:unique[0]};
}
function buildOutput(){
 if(!roster.length)throw new Error("請先匯入學生名冊");
 const tokens=parseStudents();
 if(!tokens.length)throw new Error("請輸入學生");
 const records=[];
 const errors=[];
 const used=new Set();
 for(const token of tokens){
  const match=matchStudent(token);
  if(match.error){errors.push(match.error);continue;}
  const s=match.student;
  if(used.has(s.school))continue;
  used.add(s.school);
  records.push({
   "學號":s.school,
   "姓名":s.name,
   "獎懲依據（條）":$("article").value.trim(),
   "獎懲依據（款）":$("clause").value.trim(),
   "獎懲依據（目）":$("item").value.trim(),
   "獎懲事由":$("reason").value.trim(),
   "額度":$("amount").value.trim(),
   "加重減輕事由":$("adjustReason").value.trim(),
   "加重減輕額度":$("adjustAmount").value.trim()
  });
 }
 if(errors.length)throw new Error(
  "以下學生無法確認，請修正後再匯出：\n"+errors.join("\n")
 );
 if(!records.length)throw new Error("沒有可產生的紀錄");
 if(!$("article").value||!$("clause").value)throw new Error("請依序選擇獎懲依據（條）、（款）");\n if(!$("item").disabled&&!$("item").value)throw new Error("請選擇獎懲依據（目）");\n if(!$("reason").value.trim())throw new Error("尚未帶入獎懲事由");
 if(!$("amount").value.trim())throw new Error("請填寫額度");
 return records;
}
function preview(){
 try{
  output=buildOutput();
  const tbody=$("previewBody");
  tbody.replaceChildren();
  for(const record of output){
   const tr=document.createElement("tr");
   [
    "學號","姓名","獎懲依據（條）","獎懲依據（款）",
    "獎懲依據（目）","獎懲事由","額度"
   ].forEach(key=>{
    const td=document.createElement("td");
    td.textContent=record[key];
    tr.appendChild(td);
   });
   tbody.appendChild(tr);
  }
  $("resultStatus").textContent="成功建立 "+output.length+" 筆紀錄";
  $("resultStatus").className="status ok";
  $("exportBtn").disabled=false;
 }catch(e){
  output=[];
  $("previewBody").replaceChildren();
  $("exportBtn").disabled=true;
  $("resultStatus").textContent=e.message;
  $("resultStatus").className="status error";
 }
}
function exportExcel(){
 if(!output.length)return;
 const data=[
  templateHeaders,
  ...output.map(r=>templateHeaders.map(h=>r[h]??""))
 ];
 const wb=XLSX.utils.book_new();
 const ws=XLSX.utils.aoa_to_sheet(data);
 ws["!cols"]=[
  {wch:17},{wch:12},{wch:18},{wch:18},{wch:18},
  {wch:55},{wch:12},{wch:25},{wch:18}
 ];
 XLSX.utils.book_append_sheet(wb,ws,"獎懲匯入");
 const date=new Date();
 const stamp=[
  date.getFullYear(),
  String(date.getMonth()+1).padStart(2,"0"),
  String(date.getDate()).padStart(2,"0")
 ].join("");
 XLSX.writeFile(wb,"獎懲紀錄_"+stamp+".xlsx");
}
$("rosterFile").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file)return;
 try{
  const wb=await readExcel(file);
  roster=extractRoster(wb);
  setImportStatus("已載入 "+roster.length+" 位學生；獎懲項目 "+rules.length+" 筆");
 }catch(err){setImportStatus(err.message,true);}
});
$("templateFile").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file)return;
 try{
  const wb=await readExcel(file);
  templateWorkbook=wb;
  rules=extractRules(wb);
  refreshRules();
  setImportStatus("已載入 "+roster.length+" 位學生；獎懲項目 "+rules.length+" 筆");
 }catch(err){setImportStatus(err.message,true);}
});
$("ruleSearch").addEventListener("input",refreshRules);
$("articleFilter").addEventListener("change",refreshRules);
$("ruleSelect").addEventListener("change",applyRule);
$("previewBtn").addEventListener("click",preview);
$("exportBtn").addEventListener("click",exportExcel);
$("clearBtn").addEventListener("click",()=>{
 $("studentInput").value="";
 $("reason").value="";
 $("article").value="";
 $("clause").value="";
 $("item").value="";
 $("amount").value="";
 $("adjustReason").value="";
 $("adjustAmount").value="";
 output=[];
 $("previewBody").replaceChildren();
 $("exportBtn").disabled=true;
 $("resultStatus").textContent="已清除輸入";
});
</script>
<script>
/* v1.2 學生辨識與重複警示 */

(function () {
  const input = document.getElementById("studentInput");


  if (!input) return;

  // 建立警示顯示區域
  const panel = document.createElement("div");
  panel.id = "studentCheckPanel";
  panel.style.cssText = `
    margin-top:16px;
    padding:14px;
    border:1px solid #dce4ef;
    border-radius:10px;
    background:#f8fafc;
    line-height:1.8;
    font-size:14px;
  `;

  input.insertAdjacentElement("afterend", panel);

  function escapeHTML(value) {
    return String(value ?? "").replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      })[c]
    );
  }

  function getTokens() {
    const raw = input.value
      .split(/[\s,，、;；]+/)
      .map(s => s.trim())
      .filter(Boolean);

    const expanded = [];

    for (const value of raw) {
      const range = value.match(/^(\d{1,3})-(\d{1,3})$/);

      if (range) {
        const start = Number(range[1]);
        const end = Number(range[2]);

        if (end >= start && end - start <= 300) {
          for (let n = start; n <= end; n++) {
            expanded.push(String(n).padStart(3, "0"));
          }
          continue;
        }
      }

      expanded.push(
        value
      );
    }

    return expanded;
  }

  function checkStudents() {
    const tokens = getTokens();

    if (!tokens.length) {
      panel.innerHTML = "尚未輸入學生資料";
      return;
    }

    if (typeof roster === "undefined" || !roster.length) {
      panel.innerHTML =
        '<span style="color:#b42318">請先匯入學生名冊</span>';
      return;
    }

    const counts = new Map();
    const students = new Map();
    const errors = [];
    const repeated = new Set();

    function normalizeValue(value) {
      return String(value ?? "")
        .trim()
        .replace(/\s+/g, "")
        .toLowerCase();
    }

    // 第一階段：比對學生名冊
    for (const token of tokens) {
      const t=normalizeValue(token);
      const matches=[...new Map(roster.filter(s =>
        normalizeValue(s.name)===t ||
        normalizeValue(s.team)===t ||
        (/^\d{1,3}$/.test(t) && normalizeValue(s.female).padStart(3,"0")===t.padStart(3,"0"))
      ).map(s=>[s.school,s])).values()];

      if (matches.length === 0) {
        errors.push({
          token,
          message:"查無此學生"
        });
        continue;
      }

      if (matches.length > 1) {
        errors.push({
          token,
          message:"符合多位學生，無法唯一辨識"
        });
        continue;
      }

      const student = matches[0];
      const key = String(student.school);

      counts.set(key, (counts.get(key) || 0) + 1);
      students.set(key, student);
    }

    // 第二階段：顯示辨識結果
    let html = `
      <div style="font-weight:bold;margin-bottom:8px">
        學生辨識結果
      </div>
    `;

    for (const [key, student] of students) {
      const count = counts.get(key);
      const duplicate = count > 1;

      const female = escapeHTML(student.female);
      const team = escapeHTML(student.team);
      const name = escapeHTML(student.name);
      const school = escapeHTML(student.school);

      html += `
        <div style="
          padding:9px 0;
          border-bottom:1px solid #e2e8f0;
        ">
          <div>
            ${duplicate ? "🔴" : "✅"}
            <strong>${name}</strong>
            ${duplicate
              ? `<strong style="color:#dc2626">
                  重複 ${count} 次
                 </strong>`
              : `<span style="color:#15803d">
                  辨識成功
                 </span>`
            }
          </div>
          <div style="color:#64748b;font-size:13px">
            女生隊號：${female}　
            建制隊號：${team}　
            學籍號碼：${school}
          </div>
        </div>
      `;

      if (duplicate) repeated.add(key);
    }

    // 第三階段：無法辨識者以紅字顯示
    for (const error of errors) {
      html += `
        <div style="
          padding:9px 0;
          color:#dc2626;
          border-bottom:1px solid #fee2e2;
        ">
          ❌ <strong>${escapeHTML(error.token)}</strong>
          — ${escapeHTML(error.message)}
        </div>
      `;
    }

    // 第四階段：統計
    html += `
      <div style="
        margin-top:12px;
        padding:10px;
        background:#eef2f7;
        border-radius:8px;
      ">
        輸入總次數：${tokens.length}<br>
        辨識成功：${students.size} 位<br>
        重複學生：${repeated.size} 位<br>
        無法辨識：${errors.length} 筆
      </div>
    `;

    panel.innerHTML = html;
  }

  input.addEventListener("input", checkStudents);

  const rosterInput = document.getElementById("rosterFile");
  if (rosterInput) {
    rosterInput.addEventListener("change", () => {
      setTimeout(checkStudents, 900);
    });
  }

  checkStudents();
})();
</script>
</body>
</html>
